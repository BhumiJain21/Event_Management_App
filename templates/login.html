{% extends "base.html" %}
{% block content %}
<div class="card">
    <img src="{{ url_for('static', filename='logo.jpg') }}" style="width: 80px; margin-bottom: 10px;">
    <h2>Portal Login</h2>
    <form method="post">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Sign In</button>
    </form>
</div>
{% endblock %}
